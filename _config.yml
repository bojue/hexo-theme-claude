# =========================================================
# Hexo Theme Claude Configuration
# 极简、内容驱动、Claude 经典配色的现代 Hexo 主题
# =========================================================

# ---------------------------------------------------------
# 品牌与站点信息 (Brand & Site Info)
# ---------------------------------------------------------
brand:
  name: Claude

# ---------------------------------------------------------
# 导航菜单 (Navigation Menu)
# 内容优先：直出文章流，无臃肿首页
# 「关于」页面需先创建：hexo new page about
# ---------------------------------------------------------
menu:
  文章: /
  归档: /archives
  关于: /about

# ---------------------------------------------------------
# 文章详情与目录设置 (Post & TOC Settings)
# 目录在桌面端 (>= 1024px) 右侧自动吸顶，小屏自动隐藏
# ---------------------------------------------------------
toc:
  enable: true
  max_depth: 3

# 文章字数与阅读时间估计
reading_info:
  enable: false
  words_per_minute: 400

# 上一篇 / 下一篇卡片导航
post_nav:
  enable: true

# ---------------------------------------------------------
# 本地搜索 (Local Search)
# 快捷键支持: Cmd+K / Ctrl+K 或按下 '/' 快速唤起
# ---------------------------------------------------------
search:
  enable: true
  path: /search.json

# ---------------------------------------------------------
# 社交链接 (Social Links)
# 请替换为你自己的链接
# ---------------------------------------------------------
social:
  github: https://github.com/bojue/hexo-theme-claude

# ---------------------------------------------------------
# 页脚 (Footer)
# ---------------------------------------------------------
footer:
  license: MIT License
